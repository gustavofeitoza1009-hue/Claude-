const timeline = await (await fetch('build/timeline.json')).json();
const emojiRe = /(\p{Extended_Pictographic}️?)/u;
const wrapEmoji = s => s.split(emojiRe).map(p => emojiRe.test(p) ? `<span class="emo">${p}</span>` : p).join('');
// divide falas em blocos de até 3 palavras, com tempo por palavra proporcional ao tamanho
const chunks = [];
for (const line of timeline) {
  const words = line.text.split(/\s+/).filter(Boolean);
  const weights = words.map(w => w.replace(/[^\p{L}\p{N}]/gu, '').length + 2 + (/[,.!?:]$/.test(w) ? 3 : 0));
  const total = weights.reduce((a, b) => a + b, 0); let acc = 0;
  const wt = words.map((w, i) => { const s = line.start + (acc / total) * (line.end - line.start); acc += weights[i]; return { w, s, e: line.start + (acc / total) * (line.end - line.start) }; });
  let cur = [];
  wt.forEach((x, i) => { cur.push(x); const brk = /[,.!?:]$/.test(x.w) || cur.length >= 3 || i === wt.length - 1; if (brk) { chunks.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e, speaker: line.speaker }); cur = []; } });
}
chunks.forEach((c, i) => { const n = chunks[i + 1]; c.hold = n ? Math.min(n.s, c.e + 0.6) : c.e + 0.8; });
const capEl = document.getElementById('cap'), titleEl = document.getElementById('title');
const speakerColor = { narr: '#ffffff', mom: '#ffb3e6', hero: '#9ff6ff' };
let lastCapKey = '';
function updateCaptions(t) {
  const c = toAnim(t) > 68.45 ? null : chunks.find(c => t >= c.s - 0.05 && t < c.hold);
  if (!c) { capEl.innerHTML = ''; lastCapKey = ''; return; }
  const appear = easeOutBack(clamp((t - c.s + 0.05) / 0.18));
  capEl.style.transform = `scale(${(0.6 + 0.4 * appear).toFixed(3)})`;
  capEl.innerHTML = c.words.map(x => {
    const active = t >= x.s && t < x.e + 0.02; const caps = /[A-ZÀ-Ú]{3,}|\d/.test(x.w) && x.w === x.w.toUpperCase();
    const col = active ? '#ffe03a' : caps ? '#5dff7a' : speakerColor[c.speaker];
    const sc = active ? 1.14 : 1; const rot = active ? -3 : 0;
    return `<span class="w" style="color:${col};transform:scale(${sc}) rotate(${rot}deg)">${wrapEmoji(x.w.toUpperCase())}</span>`;
  }).join(' ');
}

];

POPS.forEach(p => {
  if (p.burst) { const b = document.createElement('div'); b.className = 'burst'; b.style.left = (p.x - 300) + 'px'; b.style.top = (p.y - 230) + 'px'; b.style.width = '600px'; b.style.height = '460px';
    const pts = Array.from({ length: 28 }, (_, i) => { const a = i / 28 * Math.PI * 2, r = i % 2 ? 50 : 34 + (i % 4) * 4; return `${50 + Math.cos(a) * r}% ${50 + Math.sin(a) * r}%`; }).join(',');
    b.style.background = p.burst; b.style.clipPath = `polygon(${pts})`; b.style.filter = 'drop-shadow(0 0 0 #160030)'; popsEl.appendChild(b); p.bEl = b; }
  const el = document.createElement('div'); el.className = 'pop'; el.innerHTML = wrapEmoji(p.text); el.style.fontSize = p.size + 'px'; el.style.color = p.color; popsEl.appendChild(el); p.el = el;

function updatePops(t) {
  POPS.forEach(p => {
    const on = t >= p.s && t < p.e; p.el.style.display = on ? 'block' : 'none'; if (p.bEl) p.bEl.style.display = on ? 'block' : 'none'; if (!on) return;
    const lt = t - p.s, k = easeOutBack(clamp(lt / 0.22)), out = 1 - ss(p.e - 0.18, p.e, t);
    const sc = k * out * (1 + 0.04 * Math.sin(lt * 14));
    const w = p.el.offsetWidth, h = p.el.offsetHeight;
    p.el.style.left = (p.x - w / 2) + 'px'; p.el.style.top = (p.y - h / 2) + 'px';
    p.el.style.transform = `scale(${sc.toFixed(3)}) rotate(${p.rot + Math.sin(lt * 6) * 2}deg)`;
    if (p.bEl) p.bEl.style.transform = `scale(${(sc * 1.05).toFixed(3)}) rotate(${(lt * 40).toFixed(1)}deg)`;
  });
}

const wipe = document.getElementById('wipe'), wctx = wipe.getContext('2d'), flash = document.getElementById('flash');
const CUTS = [5, 15, 25, 37, 50, 62];
const FLASHES = [8.6, 11.6, 17.3, 41.35, 9.5];
function updateFx(t) {
  let w = 0, cc = null;
  for (const c of CUTS) { const d = t - c; if (d > -0.22 && d < 0.22) { w = 1 - Math.abs(d) / 0.22; cc = c; } }
  wctx.clearRect(0, 0, W, H);
  if (w > 0) { wipe.style.opacity = 1; const r = easeOutCubic(w) * 1250; const cols = ['#ff3d7f', '#ffd23f', '#3df5ff', '#7cff4f', '#a259ff', '#ff8a1f'];
    [1, 0.75, 0.5].forEach((f, i) => { wctx.fillStyle = cols[(CUTS.indexOf(cc) + i) % 6]; wctx.beginPath(); wctx.arc(W / 2, H / 2, r * f, 0, 7); wctx.fill(); }); }
  else wipe.style.opacity = 0;
  let f = 0; for (const x of FLASHES) { const d = t - x; if (d >= 0 && d < 0.18) f = Math.max(f, 0.75 * (1 - d / 0.18)); }
  flash.style.opacity = f.toFixed(3);
}

const toAnim = t => { for (const [n0, o0, n1, o1] of TM.segments) if (t < n1) return o0 + (Math.max(0, t - n0)) * (o1 - o0) / (n1 - n0); return 69.999; };
window.renderAt = (tReal) => {
  const t = toAnim(tReal);
  const sc = scenes.find(s => t >= s.start && t < s.end) || scenes[scenes.length - 1];
  document.getElementById('xray').style.opacity = 0;
  camera.fov = 50; camera.up.set(0, 1, 0);
  sc.update(t);
  camera.updateProjectionMatrix();
  renderer.render(sc.scene, camera);
  updateCaptions(tReal); updateTitle(t); updatePops(t); updateFx(t);
  return true;
};
